  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x-width: 1120px; margin: 0 auto; padding: 92px 32px 104px; text-align: center;\">\n      <div style=\"display: inline-flex; align-items: center; gap: 8px; padding: 7px 15px; border-radius: 999px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.20); margin-bottom: 28px;\">\n        <span style=\"width: 7px; height: 7px; border-radius: 50%; background: #58C3D6;\"><\u002Fspan>\n        <span style=\"font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.92); letter-spacing: 0.01em;\">선생님을 위한 생활지도 기록 자동화<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font-family: var(--font-brand); margin: 0 0 22px; font-size: 52px; line-height: 1.22; font-weight: 700; letter-spacing: -0.03em; color: #fff; text-wrap: balance;\">기록은 간편하게,<br>지도는 더 깊이 있게<\u002Fh1>\n      <p style=\"max-width: 600px; margin: 0 auto 40px; font-size: 18px; line-height: 1.7; color: rgba(255,255,255,0.80); text-wrap: pretty; width: 582px; height: 59px\">학생 이름만 입력하면 명렬표가 자동으로 채워지고, 버튼 한 번이면 통계 파일까지 정리됩니다. 선생님의 시간을 아껴, 학생 한 명 한 명에게 더 집중하세요.<\u002Fp>\n      <div style=\"display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;\">\n        <a href=\"#steps\" style=\"display: inline-flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 600; color: #1B2A4A; background: #fff; padding: 14px 26px; border-radius: 12px; text-decoration: none; box-shadow: 0 8px 24px rgba(0,0,0,0.18);\">사용 방법 보기\n          <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2A4A\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n        <a href=\"#areas\" style=\"display: inline-flex; align-items: center; font-size: 15px; font-weight: 600; color: #fff; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.26); padding: 14px 26px; border-radius: 12px; text-decoration: none;\">기록 영역 살펴보기<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; justify-content: center; gap: 40px; margin-top: 56px; flex-wrap: wrap;\">\n        <div style=\"text-align: center;\">\n          <div style=\"font-family: var(--font-brand); font-size: 30px; font-weight: 700; color: #fff; letter-spacing: -0.02em;\">3영역<\u002Fdiv>\n          <div style=\"font-size: 13px; color: rgba(255,255,255,0.62); margin-top: 3px;\">지각·태도·분리지도<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width: 1px; height: 38px; background: rgba(255,255,255,0.18);\"><\u002Fdiv>\n        <div style=\"text-align: center;\">\n          <div style=\"font-family: var(--font-brand); font-size: 30px; font-weight: 700; color: #fff; letter-spacing: -0.02em;\">원클릭<\u002Fdiv>\n          <div style=\"font-size: 13px; color: rgba(255,255,255,0.62); margin-top: 3px;\">데이터 자동 전송<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width: 1px; height: 38px; background: rgba(255,255,255,0.18);\"><\u002Fdiv>\n        <div style=\"text-align: center;\">\n          <div style=\"font-family: var(--font-brand); font-size: 30px; font-weight: 700; color: #fff; letter-spacing: -0.02em;\">8주<\u002Fdiv>\n          <div style=\"font-size: 13px; color: rgba(255,255,255,0.62); margin-top: 3px;\">문제행동 추이 분석<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== 운영 목적 ===== -->\n  <section id=\"purpose\" style=\"max-width: 1120px; margin: 0 auto; padding: 100px 32px 40px;\">\n    <div style=\"text-align: center; margin-bottom: 52px;\">\n      <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #2A4374; text-transform: uppercase; margin-bottom: 12px;\">PURPOSE<\u002Fdiv>\n      <h2 style=\"margin: 0 0 14px; font-size: 34px; font-weight: 700; letter-spacing: -0.025em; color: rgb(23,23,23);\">우리가 함께 만들어가는 학교<\u002Fh2>\n      <p style=\"margin: 0; font-size: 16px; color: rgba(55,56,60,0.61);\">일관된 생활지도가 만들어내는 세 가지 변화<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px;\">\n      <div style=\"background: #fff; border: 1px solid rgba(0,0,0,0.05); border-radius: 18px; padding: 32px 28px; box-shadow: 0 2px 10px rgba(27,42,74,0.04);\">\n        <div style=\"width: 50px; height: 50px; border-radius: 14px; background: #EAF1FF; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;\">\n          <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1857C4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3 style=\"margin: 0 0 10px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em;\">자기 관리 역량<\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: rgba(55,56,60,0.72); text-wrap: pretty; width: 267px; height: 48px\">바른 생활습관 형성을 통해 스스로를 관리할 줄 아는 인재로 성장하도록 돕습니다.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid rgba(0,0,0,0.05); border-radius: 18px; padding: 32px 28px; box-shadow: 0 2px 10px rgba(27,42,74,0.04);\">\n        <div style=\"width: 50px; height: 50px; border-radius: 14px; background: #E5F6FA; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;\">\n          <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0E7C90\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3 style=\"margin: 0 0 10px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em;\">학습권 보장<\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: rgba(55,56,60,0.72); text-wrap: pretty;\">모든 학생의 학습권을 지켜, 안전하고 안정적인 학교 분위기를 함께 만들어 갑니다.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid rgba(0,0,0,0.05); border-radius: 18px; padding: 32px 28px; box-shadow: 0 2px 10px rgba(27,42,74,0.04);\">\n        <div style=\"width: 50px; height: 50px; border-radius: 14px; background: #F0ECFF; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;\">\n          <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6B4DE6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z\"><\u002Fpath><path d=\"M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3 style=\"margin: 0 0 10px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em;\">수업권 보장<\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: rgba(55,56,60,0.72); text-wrap: pretty;\">성실히 준비한 수업을 온전히 구현하여, 교사의 자존감과 보람을 높입니다.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== 주요 기능 ===== -->\n  <section id=\"features\" style=\"max-width: 1120px; margin: 0 auto; padding: 80px 32px 40px;\">\n    <div style=\"text-align: center; margin-bottom: 52px;\">\n      <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #2A4374; text-transform: uppercase; margin-bottom: 12px;\">FEATURES<\u002Fdiv>\n      <h2 style=\"margin: 0 0 14px; font-size: 34px; font-weight: 700; letter-spacing: -0.025em;\">번거로움은 줄이고, 인사이트는 더하고<\u002Fh2>\n      <p style=\"margin: 0; font-size: 16px; color: rgba(55,56,60,0.61);\">기록부터 통계까지, 선생님의 손이 가장 적게 가도록<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 22px;\">\n      <!-- 자동 입력 -->\n      <div style=\"background: #fff; border: 1px solid rgba(0,0,0,0.05); border-radius: 20px; padding: 34px; box-shadow: 0 2px 10px rgba(27,42,74,0.04); display: flex; gap: 20px;\">\n        <div style=\"flex: none; width: 52px; height: 52px; border-radius: 14px; background: #EAF1FF; display: flex; align-items: center; justify-content: center;\">\n          <svg width=\"25\" height=\"25\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1857C4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2L3 14h7l-1 8 10-12h-7z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin: 0 0 9px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em;\">자동 완성 입력<\u002Fh3>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: rgba(55,56,60,0.72); text-wrap: pretty; width: 337px; height: 51px\">학생 이름만 입력하면 명렬표와 연동되어 학년·반·번호가 자동으로 채워집니다.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- 원클릭 전송 -->\n      <div style=\"background: #fff; border: 1px solid rgba(0,0,0,0.05); border-radius: 20px; padding: 34px; box-shadow: 0 2px 10px rgba(27,42,74,0.04); display: flex; gap: 20px;\">\n        <div style=\"flex: none; width: 52px; height: 52px; border-radius: 14px; background: #E5F6FA; display: flex; align-items: center; justify-content: center;\">\n          <svg width=\"25\" height=\"25\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0E7C90\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 2L11 13\"><\u002Fpath><path d=\"M22 2l-7 20-4-9-9-4z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin: 0 0 9px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em;\">원클릭 데이터 전송<\u002Fh3>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: rgba(55,56,60,0.72); text-wrap: pretty; width: 323px; height: 49px\">'기록 저장' 버튼 한 번이면 입력 데이터가 통계 파일로 자동 이전·백업됩니다.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- 통계 검색 (와이드, 미니 차트) -->\n      <div style=\"grid-column: 1 / -1; background: #fff; border: 1px solid rgba(0,0,0,0.05); border-radius: 20px; padding: 36px; box-shadow: 0 2px 10px rgba(27,42,74,0.04); display: flex; align-items: center; gap: 40px; flex-wrap: wrap;\">\n        <div style=\"flex: 1 1 320px;\">\n          <div style=\"display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #F0ECFF; margin-bottom: 16px;\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6B4DE6\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M21 21l-4-4\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size: 12px; font-weight: 700; color: #6B4DE6;\">이름 검색 한 번으로<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin: 0 0 10px; font-size: 21px; font-weight: 700; letter-spacing: -0.02em;\">8주간의 추이를 한눈에<\u002Fh3>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.7; color: rgba(55,56,60,0.72); max-width: 420px; text-wrap: pretty; width: 340px; height: 49px\">학생 이름을 검색하면 최근 8주간 문제행동 추이 그래프와 지각·태도·분리지도 누계를 즉시 확인할 수 있습니다.<\u002Fp>\n        <\u002Fdiv>\n        <!-- mini chart card -->\n        <div style=\"flex: 1 1 300px; min-width: 280px; background: #FAFAFB; border: 1px solid rgba(0,0,0,0.05); border-radius: 16px; padding: 22px;\" data-comment-anchor=\"f3f50d3cc9-div\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;\">\n            <span style=\"font-size: 13px; font-weight: 700; color: rgba(23,23,23,0.88);\">주간 문제행동 추이<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 600; color: #6B4DE6; background: #F0ECFF; padding: 3px 8px; border-radius: 6px;\">최근 8주<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 16px; margin-bottom: 14px;\">\n            <div style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 14px; height: 3px; border-radius: 2px; background: #1857C4;\"><\u002Fspan><span style=\"font-size: 11px; font-weight: 600; color: rgba(46,47,51,0.78);\">지각<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 14px inecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 3v18\"><\u002Fpath><path d=\"M3 5h6l3 3h9v11H3z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size: 11px; font-weight: 700; color: #0E7C90; letter-spacing: 0.04em;\">AREA 03<\u002Fdiv>\n                <h3 style=\"margin: 2px 0 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; color: #0A5C6C;\">분리지도<\u002Fh3>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin: 0 0 18px; font-size: 14px; line-height: 1.6; color: rgba(55,56,60,0.72);\">교육활동 방해 시 분리 내용을 기록합니다.<\u002Fp>\n            <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n              <div style=\"display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: rgba(46,47,51,0.82);\"><span style=\"width: 5px; height: 5px; border-radius: 50%; background: #0E7C90; flex: none;\"><\u002Fspan>분리 장소<\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: rgba(46,47,51,0.82);\"><span style=\"width: 5px; height: 5px; border-radius: 50%; background: #0E7C90; flex: none;\"><\u002Fspan>분리 시간<\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: rgba(46,47,51,0.82);\"><span style=\"width: 5px; height: 5px; border-radius: 50%; background: #0E7C90; flex: none;\"><\u002Fspan>지도 내용<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== 사용 방법 4단계 ===== -->\n  <section id=\"steps\" style=\"max-width: 1120px; margin: 0 auto; padding: 96px 32px 40px;\">\n    <div style=\"text-align: center; margin-bottom: 56px;\">\n      <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #2A4374; text-transform: uppercase; margin-bottom: 12px;\">HOW TO USE<\u002Fdiv>\n      <h2 style=\"margin: 0 0 14px; font-size: 34px; font-weight: 700; letter-spacing: -0.025em;\">단 4단계면 충분합니다<\u002Fh2>\n      <p style=\"margin: 0; font-size: 16px; color: rgba(55,56,60,0.61);\">구글 앱스크립트 연동으로 입력부터 통계까지 자동으로<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;\">\n      <!-- STEP 1 -->\n      <div style=\"position: relative; background: #fff; border: 1px solid rgba(0,0,0,0.05); border-radius: 18px; padding: 30px 24px; box-shadow: 0 2px 10px rgba(27,42,74,0.04);\">\n        <div style=\"font-family: var(--font-brand); font-size: 40px; font-weight: 700; color: #DFE7F5; line-height: 1; letter-spacing: -0.03em;\">01<\u002Fdiv>\n        <div style=\"display: inline-block; font-size: 11px; font-weight: 700; color: #1857C4; background: #EAF1FF; padding: 4px 10px; border-radius: 7px; margin: 16px 0 12px;\">설정<\u002Fdiv>\n        <h3 style=\"margin: 0 0 8px; font-size: 17px; font-weight: 700; letter-spacing: -0.02em;\">최초 1회 설정<\u002Fh3>\n        <p style=\"margin: 0; font-size: 13.5px; line-height: 1.6; color: rgba(55,56,60,0.72); width: 183px; height: 40px\">설정 탭에서 교사 이름과 이메일을 한 번만 입력합니다.<\u002Fp>\n      <\u002Fdiv>\n      <!-- STEP 2 -->\n      <div style=\"position: relative; background: #fff; border: 1px solid rgba(0,0,0,0.05); border-radius: 18px; padding: 30px 24px; box-shadow: 0 2px 10px rgba(27,42,74,0.04);\">\n        <div style=\"font-family: var(--font-brand); font-size: 40px; font-weight: 700; color: #DFE7F5; line-height: 1; letter-spacing: -0.03em;\">02<\u002Fdiv>\n        <div style=\"display: inline-block; font-size: 11px; font-weight: 700; color: #1857C4; background: #EAF1FF; padding: 4px 10px; border-radius: 7px; margin: 16px 0 12px;\">빠른 입력<\u002Fdiv>\n        <h3 style=\"margin: 0 0 8px; font-size: 17px; font-weight: 700; letter-spacing: -0.02em;\">이름만 입력<\u002Fh3>\n        <p style=\"margin: 0; font-size: 13.5px; line-height: 1.6; color: rgba(55,56,60,0.72);\">'빈자리 입력 탭'을 열고 학생 이름만 입력 — 최대 10건 동시 입력.<\u002Fp>\n      <\u002Fdiv>\n      <!-- STEP 3 -->\n      <div style=\"position: relative; background: #fff; border: 1px solid rgba(0,0,0,0.05); border-radius: 18px; padding: 30px 24px; box-shadow: 0 2px 10px rgba(27,42,74,0.04);\">\n        <div style=\"font-family: var(--font-brand); font-size: 40px; font-weight: 700; color: #DFE7F5; line-height: 1; letter-spacing: -0.03em;\">03<\u002Fdiv>\n        <div style=\"display: inline-block; font-size: 11px; font-weight: 700; color: #1857C4; background: #EAF1FF; padding: 4px 10px; border-radius: 7px; margin: 16px 0 12px;\">자동 전송<\u002Fdiv>\n        <h3 style=\"margin: 0 0 8px; font-size: 17px; font-weight: 700; letter-spacing: -0.02em;\">기록 저장<\u002Fh3>\n        <p style=\"margin: 0; font-size: 13.5px; line-height: 1.6; color: rgba(55,56,60,0.72); width: 190px; height: 39px\">앱스크립트가 데이터를 통계 시트로 이전하고 입력칸을 비웁니다.<\u002Fp>\n      <\u002Fdiv>\n      <!-- STEP 4 -->\n      <div style=\"position: relative; background: linear-gradient(160deg, #243B6B, #1B2A4A); border-radius: 18px; padding: 30px 24px; box-shadow: 0 10px 24px rgba(27,42,74,0.22);\">\n        <div style=\"font-family: var(--font-brand); font-size: 40px; font-weight: 700; color: rgba(255,255,255,0.22); line-height: 1; letter-spacing: -0.03em;\">04<\u002Fdiv>\n        <div style=\"display: inline-block; font-size: 11px; font-weight: 700; color: #fff; background: rgba(255,255,255,0.16); padding: 4px 10px; border-radius: 7px; margin: 16px 0 12px;\">조회 · 통계<\u002Fdiv>\n        <h3 style=\"margin: 0 0 8px; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; color: #fff;\">검색하고 확인<\u002Fh3>\n        <p style=\"margin: 0; font-size: 13.5px; line-height: 1.6; color: rgba(255,255,255,0.72); width: 188px; height: 42px\">통계 파일에서 학생 이름을 검색해 추이와 누계를 확인합니다.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== 설정 · 사용법 안내 ===== -->\n  <section id=\"guide\" style=\"background: #fff; border-top: 1px solid rgba(0,0,0,0.05);\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 90 n>\n                <p style=\"margin: 0; font-size: 14.5px; line-height: 1.6; color: rgba(55,56,60,0.78);\"><b style=\"color: rgb(23,23,23);\">기록 저장<\u002Fb>을 누르면 통계 시트로 자동 전송되고 입력칸이 비워집니다.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"max-width: 1120px; margin: 0 auto; padding: 70px 32px 100px;\" data-comment-anchor=\"578f164f6a-section\">\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\">\n      <div style=\"display: flex; gap: 18px; background: #FFF6F4; border: 1px solid #FAD9CE; border-radius: 18px; padding: 28px 30px;\">\n        <div style=\"flex: none; width: 46px; height: 46px; border-radius: 12px; background: #FFE6DD; display: flex; align-items: center; justify-content: center;\">\n          <svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C9420A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 8px;\">\n            <span style=\"font-size: 11px; font-weight: 700; color: #fff; background: #C9420A; padding: 3px 9px; border-radius: 6px;\">보안<\u002Fspan>\n            <h3 style=\"margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; color: #8A2E08;\">개인정보 보호 필수<\u002Fh3>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: rgba(55,56,60,0.78); text-wrap: pretty; width: 364px; height: 41px\">학생 개인정보 보호를 위해 통계 시트의 학생 노출 및 인쇄·저장 등 반출을 절대 금지합니다.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 18px; background: #FFFAF0; border: 1px solid #F5E2BE; border-radius: 18px; padding: 28px 30px;\">\n        <div style=\"flex: none; width: 46px; height: 46px; border-radius: 12px; background: #FBEFD3; display: flex; align-items: center; justify-content: center;\">\n          <svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#B5650A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2l9 4v6c0 5-3.5 8.5-9 10-5.5-1.5-9-5-9-10V6z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 8px;\">\n            <span style=\"font-size: 11px; font-weight: 700; color: #fff; background: #B5650A; padding: 3px 9px; border-radius: 6px;\">권한<\u002Fspan>\n            <h3 style=\"margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; color: #7A4A08;\">최초 권한 허용<\u002Fh3>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: rgba(55,56,60,0.78); text-wrap: pretty; width: 346px; height: 45px\">자동화 시스템(앱스크립트)의 원활한 작동을 위해 최초 사용 시 권한 허용이 필수입니다.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== FOOTER ===== -->\n  <footer style=\"background: #1B2A4A; \">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 44px 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;\">\n      <div style=\"display: flex; align-items: center; gap: 12px;\">\n        <div style=\"width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center;\">\n          <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 10v6M2 10l10-5 10 5-10 5z\"><\u002Fpath><path d=\"M6 12v5c3 3 9 3 12 0v-5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 14px; font-weight: 700; color: #fff;\">학생생활지도 일지 자동화 시스템<\u002Fdiv>\n          <div style=\"font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 2px;\">바른 생활습관, 안전한 학교, 존중받는 수업을 위하여<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size: 12px; color: rgba(255,255,255,0.45);\">© 2026 생활지도 자동화 시스템<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { hovered: null };\n  renderVals() {\n    const late = [6, 5, 5, 4, 3, 2, 2, 1];\n    const att  = [8, 7, 6, 5, 4, 4, 3, 2];\n    const sep  = [4, 3, 3, 2, 2, 1, 1, 0];\n    const cx   = [4, 17, 30.33, 43.33, 56.67, 69.67, 83, 96];\n    const weeks = cx.map((c, i) => ({\n      cx: c + '%',\n      bandLeft: (c - 6.25) + '%',\n      onEnter: () => this.setState({ hovered: i }),\n    }));\n    const h = this.state.hovered;\n    const hovered = h == null ? null : {\n      label: (h + 1) + '주차',\n      late: late[h],\n      att: att[h],\n      sep: sep[h],\n      cx: cx[h] + '%',\n    };\n    return {\n      weeks,\n      hovered,\n      onLeave: () => this.setState({ hovered: null }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
